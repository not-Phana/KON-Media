[package]
name = "kon_media_server"
version = "1.2.0"
edition = "2021"
authors = ["KON Media Search Team"]
description = "High-performance native Rust HTTP and SSE application server for KON Media Rei"

[[bin]]
name = "kon_media_server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
mime_guess = "2.0"
kon_search_core = { path = "../kon_search_core" }
