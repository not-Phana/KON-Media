[package]
name = "kon_search_core"
version = "1.1.0"
edition = "2021"
authors = ["KON Media Search Team"]
description = "Native Rust search relevance, scoring, feature extraction, and deduplication core for KON Search 1.1.0 Re"

[lib]
name = "kon_search_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
