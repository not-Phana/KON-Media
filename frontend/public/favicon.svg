<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22262E" />
      <stop offset="100%" stop-color="#16181D" />
    </linearGradient>
    <linearGradient id="mint-grad" x1="24" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8DFCB" />
      <stop offset="100%" stop-color="#72B69F" />
    </linearGradient>
    <linearGradient id="spine-grad" x1="16" y1="16" x2="23" y2="48" gradientUnits="userSpaceOnUse">
