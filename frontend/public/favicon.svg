  <!-- Media Chevron / Forward Play Arm -->
  <path d="M25 32 L39.5 19 C41.2 17.5 44 18.7 44 21 L44 23 C44 24 43.5 25 42.6 25.7 L33.2 33.5 L42.6 41.3 C43.5 42 44 43 44 44 L44 46 C44 48.3 41.2 49.5 39.5 48 L25 35 C23.8 34 23.8 32.2 25 32 Z" 
